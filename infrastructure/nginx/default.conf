# School OS - Nginx reverse proxy configuration
# Routes requests to the appropriate subdomain app or the API.

upstream api_backend {
  server api:4000;
}

upstream parent_app {
  server parent:3000;
}

upstream student_app {
  server student:3001;
}

upstream teacher_app {
  server teacher:3002;
}

upstream admin_app {
  server admin:3003;
}

server {
  listen 80;
  server_name _;

  # Redirect HTTP to HTTPS in production
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name api.schoolos.local;

  ssl_certificate /etc/ssl/certs/fullchain.pem;
  ssl_certificate_key /etc/ssl/private/privkey.pem;

  location / {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /metrics {
    proxy_pass http://api_backend;
  }

  location /uploads {
    proxy_pass http://api_backend;
  }
}

server {
  listen 443 ssl;
  server_name parent.schoolos.local;

  ssl_certificate /etc/ssl/certs/fullchain.pem;
  ssl_certificate_key /etc/ssl/private/privkey.pem;

  location / {
