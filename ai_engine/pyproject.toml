[project]
name = "smartsprout-ai"
version = "0.1.0"
description = "SmartSprout AI Engine"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ARG",
  "RUF",
]
ignore = [
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
