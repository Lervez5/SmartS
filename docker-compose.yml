# School OS - development stack
# Runs MongoDB (replica set), Redis, and the API. Apps run via `pnpm dev`.
version: '3.9'

services:
  mongodb:
    image: mongo:6
    restart: unless-stopped
    command: ['--replSet', 'rs0']
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--eval',
          "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})",
        ]
      interval: 5s
      timeout: 5s
      start_period: 5s
      start_interval: 2s
      retries: 3

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  # Central API service - WHAT the system does.
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ['pnpm', 'dev']
    env_file: .env
    environment:
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '4000:4000'
    volumes:
      - ./services/api/uploads:/app/uploads
      - ./services/api:/app
      - /app/node_modules

  # Role-specific frontends - WHO uses the system.
  parent:
    build: ./apps/parent
    command: ['pnpm', 'dev', '--', '--port', '3000']
    depends_on:
      - api
    ports:
      - '3000:3000'
    env_file: .env

  student:
    build: ./apps/student
    command: ['pnpm', 'dev', '--', '--port', '3001']
    depends_on:
      - api
    ports:
      - '3001:3001'
    env_file: .env

  teacher:
    build: ./apps/teacher
    command: ['pnpm', 'dev', '--', '--port', '3002']
    depends_on:
      - api
    ports:
      - '3002:3002'
    env_file: .env

  admin:
    build: ./apps/admin
    command: ['pnpm', 'dev', '--', '--port', '3003']
    depends_on:
      - api
    ports:
      - '3003:3003'
    env_file: .env

volumes:
  mongodb_data:
