# School OS - development infrastructure
#
# Runs MongoDB (replica set), Redis and the API in containers.
# The four frontends run on the host via `pnpm dev`:
#   student :3000  teacher :3001  parent :3002  admin :3003

services:
  mongodb:
    image: mongo:6
    restart: unless-stopped
    command: ['--replSet', 'rs0']
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--eval',
          "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})",
        ]
      interval: 5s
      timeout: 5s
      start_period: 5s
      start_interval: 2s
      retries: 3

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  # Central API service - WHAT the system does.
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ['pnpm', 'dev']
    env_file: .env
    environment:
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '4000:4000'
    volumes:
      - ./services/api/uploads:/app/uploads
      - ./services/api:/app
      - /app/node_modules

volumes:
  mongodb_data:
